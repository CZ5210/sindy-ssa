[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sindy-ssa"
version = "1.0.0"
description = "SINDy-inspired low-thrust manoeuvre reconstruction for space situational awareness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hengbo Zhou" },
    { name = "Yue Wang" },
    { name = "Haichao Gui" },
]
keywords = ["astrodynamics", "SINDy", "space situational awareness", "low thrust", "manoeuvre reconstruction"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "sympy>=1.11",
    "pysindy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
sindy-ssa = "sindy_ssa.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
